name: Cloudflare Workers CI & Deploy (wise-api-bun)

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "wise-api-bun/**"
      - ".github/workflows/cloudflare-deploy.yml"
    tags:
      - "cf-deploy-*"
      - "wise-cf-*"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "wise-api-bun/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Workers"
        required: true
        type: boolean
        default: false
      apply_migrations:
        description: "Apply D1 migrations before deploying"
        required: true
        type: boolean
        default: true

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wise-api-bun

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit & integration tests
        run: bun test

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Validate Cloudflare Workers bundle (dry-run)
        run: bunx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test-and-typecheck
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/cf-deploy-') || startsWith(github.ref, 'refs/tags/wise-cf-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wise-api-bun

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations (Remote)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.apply_migrations == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
